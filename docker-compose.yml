services:
  couchdb:
    image: couchdb:latest
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: admin
    ports:
      - "5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5984/"]
      interval: 5s
      timeout: 3s
      retries: 10

  couchdb-init:
    image: curlimages/curl:latest
    depends_on:
      couchdb:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      sh -c '
        curl -s -X PUT http://admin:admin@couchdb:5984/_users || true;
        curl -s -X PUT http://admin:admin@couchdb:5984/_replicator || true;
        curl -s -X PUT http://admin:admin@couchdb:5984/swlcg || true;
        echo "CouchDB initialized"
      '

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      CATALINA_OPTS: "-Dcouchdb=couchdb"
    depends_on:
      couchdb-init:
        condition: service_completed_successfully

volumes:
  couchdb-data:
